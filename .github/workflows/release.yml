name: release-artifacts
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e '.[dev,release]'
      - run: python -m pytest -q
      - run: python -m ruff check agentshield tests demo
      - run: python -m bandit -q -r agentshield
      - run: python -m agentshield benchmark verify
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m cyclonedx_py environment --output-format JSON --output-file dist/sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with: {name: release-candidate-artifacts, path: dist/}
      # Publishing is intentionally omitted; a human must review downloaded artifacts.
