name: release-artifacts
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e '.[dev,release]'
      - run: python -m pytest -q
      - run: python -m ruff check agentshield tests demo
      - run: python -m bandit -q -r agentshield
      - run: python -m agentshield benchmark verify
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python -m cyclonedx_py environment --output-format JSON --output-file dist/sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-artifacts
          path: |
            dist/*.whl
            dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: release-sbom
          path: dist/sbom.cdx.json

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-artifacts
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
