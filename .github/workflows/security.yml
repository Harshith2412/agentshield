name: security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e '.[release]'
      - run: python -m ruff check agentshield tests demo
      - run: python -m bandit -q -r agentshield
      - run: python -m pip_audit
      - run: python -m cyclonedx_py environment --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with: {name: cyclonedx-sbom, path: sbom.cdx.json}
