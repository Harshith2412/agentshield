name: Bug report
description: Report a reproducible AgentShield defect
body:
  - type: textarea
    attributes: {label: Description, description: What happened and what did you expect?}
    validations: {required: true}
  - type: input
    attributes: {label: AgentShield version}
    validations: {required: true}
  - type: textarea
    attributes: {label: Reproduction, description: Use simulated data and remove secrets.}
    validations: {required: true}
  - type: textarea
    attributes: {label: Security and compatibility impact}
